<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>We Are the CHAMPIons</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#ffffff;--acc:#4fc3f7;--acc2:#1a73e8;--red:#c62828;--sh:0 4px 16px rgba(0,0,0,.25);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#f2f2f5;--mut:#9a9aa2;--card:#1e1e22;--acc2:#4d9bff}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:16px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
#map{position:absolute;inset:0;z-index:0}
.float{position:absolute;z-index:500;background:var(--card);color:var(--fg);box-shadow:var(--sh)}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 70px);border-radius:24px;padding:10px 16px;font-weight:800;font-size:17px}
#top b{color:var(--acc2)}
#side{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;flex-direction:column;gap:8px;z-index:500;position:absolute}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--fg);box-shadow:var(--sh);font-size:21px}
.rb.on{background:var(--acc2);color:#fff}
#info{left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 176px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);min-height:56px;max-height:96px;overflow:auto;display:flex;flex-direction:column;justify-content:center;border-radius:18px;padding:8px 14px;font-size:14px;line-height:1.25}
#info small{color:var(--mut);display:block;margin-top:2px}
#info a{color:var(--acc2);font-weight:700}
#toast{position:absolute;z-index:1000;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 66px);background:#0d47a1;color:#fff;border-radius:16px;padding:12px 16px;font-weight:700;box-shadow:var(--sh);text-align:center}
#fab{position:absolute;z-index:500;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:156px;padding:0;height:56px;white-space:nowrap;border:0;border-radius:28px;background:var(--acc2);color:#fff;font-size:18px;font-weight:800;box-shadow:var(--sh)}
#pickbar{position:absolute;z-index:600;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--acc2);color:#fff;border-radius:16px;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--sh)}
#pickbar button{background:#fff;color:#1a73e8;border:0;border-radius:10px;padding:8px 12px;font-weight:800}
#sheet{position:absolute;z-index:700;left:0;right:0;bottom:0;background:var(--card);color:var(--fg);border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -6px 24px rgba(0,0,0,.3);transform:translateY(110%);transition:transform .25s}
#sheet.open{transform:none}
#sheet h2{margin:0 0 10px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:10px 14px;border-radius:20px;border:1px solid var(--mut);background:transparent;color:var(--fg);font-size:15px}
.chip.sel{background:var(--acc);border-color:var(--acc);color:#04323f;font-weight:700}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font-size:16px;margin-bottom:10px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc2);color:#fff;font-size:17px;font-weight:800}
.btn.g{background:transparent;color:var(--mut);margin-top:6px;font-weight:600}
.locrow{display:flex;gap:8px;margin-bottom:6px}
.locrow .chip{flex:1}
#loc{font-size:14px;color:var(--mut);margin-bottom:10px}
#msg{min-height:20px;color:var(--red);font-size:14px;margin-bottom:6px}
#cfg{position:absolute;inset:0;z-index:900;background:var(--bg);padding:24px 18px;overflow:auto}
#cfg h1{font-size:22px}#cfg h1 b{color:var(--acc2)}
.mk{width:34px;height:34px;border-radius:50%;background:#1a73e8;border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.mk svg{width:20px;height:20px}
.mk.ok{background:#2e9d4f}
.mk.st{box-shadow:0 0 0 4px var(--acc),0 2px 6px rgba(0,0,0,.45)}
.mk.new{background:var(--acc)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.pop{min-width:170px}
.pop button{display:block;width:100%;margin-top:8px;padding:11px;border-radius:10px;border:0;background:#2e9d4f;color:#fff;font-weight:800;font-size:15px}
.pop button.o{background:#e3f0ff;color:#0d47a1;font-weight:700}
.pop button.u{background:#9aa;color:#fff}
.leaflet-popup-content{margin:12px 14px}
.rb.sm{font-size:12px;font-weight:800}
.rad{display:flex;gap:6px;align-items:center;margin-top:8px}
.rad input{width:78px;margin:0;padding:9px}
.rad span{font-size:14px}
.rad button{margin:0!important;flex:1}
#tbl{position:absolute;left:0;right:0;bottom:0;height:50%;z-index:850;background:var(--card);color:var(--fg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);display:flex;flex-direction:column}
.th{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(128,128,128,.4)}
.th b{font-size:17px}.th span{flex:1;color:var(--mut);font-size:14px}
#trows{flex:1;overflow:auto;padding:4px 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
.tr{padding:10px 6px;border-bottom:1px solid rgba(128,128,128,.3)}
.tr.sel{background:rgba(79,195,247,.16);border-radius:10px}
.tn small{display:block;color:var(--mut);font-size:13px}
.ta{display:flex;gap:6px;margin-top:8px}
.ta .tb{flex:1;padding:9px 4px}
.fm{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(128,128,128,.5)}
.fm .l{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fm input,.fm select{margin:0;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font-size:16px;width:100%}
.fm select{flex:1;min-width:0}
.fm label{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px}
.fm label input{width:auto}
.tb{padding:10px 12px;border:0;border-radius:10px;font-weight:700;background:var(--acc2);color:#fff;font-size:14px}
.tb.g{background:transparent;border:1px solid var(--mut);color:var(--fg)}
.tb.r{background:transparent;border:1px solid var(--red);color:var(--red)}
.mk.car{background:#111}
.rb svg{width:24px;height:24px}
@media (orientation:landscape) and (max-height:500px){.rb{width:40px;height:40px;font-size:18px}#side{gap:5px}#top{padding:6px 14px;font-size:15px}#sheet{max-height:100%;overflow:auto}}
</style>
</head>
<body>
<div id="map"></div>
<div id="top" class="float">We Are the <b>CHAMPI</b>ons</div>
<div id="side">
  <button class="rb" id="locate" title="Ma position">◎</button>
  <button class="rb" id="carBtn" title="Voiture"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5A1.5 1.5 0 0 1 21 12.5V17a1 1 0 0 1-1 1h-1v1.2a.8.8 0 0 1-.8.8h-1.4a.8.8 0 0 1-.8-.8V18H8v1.2a.8.8 0 0 1-.8.8H5.8a.8.8 0 0 1-.8-.8V18H4a1 1 0 0 1-1-1v-4.5A1.5 1.5 0 0 1 4.5 11H5zm2.1 0h9.8l-1-3.2a.5.5 0 0 0-.5-.3H8.6a.5.5 0 0 0-.5.3L7.1 11zM6.8 15.2a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm10.4 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg></button>
  <button class="rb on" id="togRoute" title="Itinéraire">➤</button>
  <button class="rb" id="recalc" title="Recalculer">↻</button>
  <button class="rb sm" id="raz" title="Remettre à zéro">RAZ</button>
  <button class="rb sm" id="tblBtn" title="Table">Table</button>
</div>
<div id="info" class="float">Chargement…</div>
<button id="fab">🍄 Signaler</button>
<div id="toast" hidden></div>
<div id="pickbar" hidden><span>Touche la carte pour placer le champignon</span><button id="pickCancel">Annuler</button></div>

<div id="sheet">
  <h2>Signaler un champignon</h2>
  <div class="chips" id="chips"></div>
  <input id="ttl" placeholder="Titre">
  <input id="note" type="number" inputmode="numeric" min="1" placeholder="Nombre de champi">
  <div class="locrow">
    <button class="chip sel" id="useGps">Ma position</button>
    <button class="chip" id="usePick">Sur la carte</button>
  </div>
  <div id="loc">Position : GPS du téléphone</div>
  <div id="msg"></div>
  <button class="btn" id="send">Signaler</button>
  <button class="btn g" id="close">Annuler</button>
</div>

<div id="tbl" hidden>
  <div class="th"><b>Table des coins</b><span id="tcount"></span><button class="tb g" id="tclose">Fermer</button></div>
  <div id="trows"></div>
</div>

<div id="cfg" hidden>
  <h1>We Are the <b>CHAMPI</b>ons</h1>
  <p>Connexion (une seule fois, tu restes connecté ensuite).</p>
  <input id="email" type="email" placeholder="Email" autocapitalize="off" autocorrect="off" autocomplete="username">
  <input id="pass" type="password" placeholder="Code" autocomplete="current-password">
  <div id="lmsg" style="color:var(--red);min-height:20px;margin-bottom:8px"></div>
  <button class="btn" id="login">Se connecter</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const URL_='https://ifittriygtqpgewdwkfo.supabase.co',KEY='sb_publishable_l4wgX0eaGvC1ANzzJWAMjw_jl33dMsM';

/* ---------- Supabase + connexion ---------- */
let sess=null;try{sess=JSON.parse(store.get('sb_sess')||'null')}catch(e){}
const saveSess=d=>{sess={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)};store.set('sb_sess',JSON.stringify(sess))};
function showLogin(){sess=null;store.del('sb_sess');$('cfg').hidden=false}
async function auth(body,grant){
  const r=await fetch(URL_+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.access_token)throw new Error('refus');
  saveSess(d);
}
async function token(){
  if(!sess){showLogin();throw new Error('login')}
  if(sess.expires_at-60<Date.now()/1000){
    try{await auth({refresh_token:sess.refresh_token},'refresh_token')}catch(e){showLogin();throw new Error('login')}
  }
  return sess.access_token;
}
async function api(path,opt={}){
  const tk=await token();
  const r=await fetch(URL_+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+tk,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){showLogin();throw new Error('login')}
  if(!r.ok)throw new Error(await r.text());
  return r.status===204?null:r.json().catch(()=>null);
}
$('login').onclick=async()=>{
  $('lmsg').textContent='';
  try{await auth({email:$('email').value.trim(),password:$('pass').value},'password');$('pass').value='';$('cfg').hidden=true;load()}
  catch(e){$('lmsg').textContent='Email ou code incorrect.'}
};
$('pass').onkeydown=e=>{if(e.key==='Enter')$('login').click()};

/* ---------- Carte & fonds ---------- */
const map=L.map('map',{zoomControl:false,maxZoom:21}).setView([48.409,2.606],15);
const ign=(layer,fmt)=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&FORMAT=${fmt}&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const ortho=L.tileLayer(ign('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'),{maxNativeZoom:18,maxZoom:21,attribution:'© IGN / Géoplateforme'}).addTo(map);
const roads=L.tileLayer(ign('TRANSPORTNETWORKS.ROADS','image/png'),{maxNativeZoom:18,maxZoom:21}).addTo(map);

const ptLayer=L.layerGroup().addTo(map);
const routeLine=L.polyline([],{color:'#1a73e8',weight:6,opacity:.85}).addTo(map);
let pts=[],order=[],usedMe=false,showRoute=true,me=null,meMarker=null,fitted=false,startId=null;

let search=null,radius=+store.get('rad')||50;
const MUSH='<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3C6.5 3 3 7 3 11.5c0 .8.6 1.5 1.5 1.5h15c.9 0 1.5-.7 1.5-1.5C21 7 17.5 3 12 3z"/><path fill="#fff" d="M9.5 14h5v4.5a2.5 2.5 0 0 1-5 0V14z"/></svg>';
const hv=(a,b)=>{const R=6371000,r=Math.PI/180,dp=(b[0]-a[0])*r,dl=(b[1]-a[1])*r;
  const h=Math.sin(dp/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtD=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const nameOf=p=>{const t=p.type||'',n=(p.title&&p.title!==t)?p.title:'';return (t&&n)?t+' – '+n:(t||n||'Coin')};

/* ---------- Trajet le plus court (chemin ouvert, vol d'oiseau) ---------- */
function plan(){
  usedMe=false;order=[];
  const act=pts.map((_,i)=>i).filter(i=>!pts[i].fait||pts[i].id===startId);
  if(!act.length)return;
  const P=act.map(i=>[+pts[i].lat,+pts[i].lon]);
  const si=act.findIndex(i=>pts[i].id===startId);
  let nodes=P,off=0,fixed=-1;
  if(si>=0)fixed=si;
  else if(me&&Math.min(...P.map(p=>hv([me.lat,me.lon],p)))<5000){usedMe=true;nodes=[[me.lat,me.lon],...P];off=1;fixed=0}
  const N=nodes.length,D=nodes.map(a=>nodes.map(b=>hv(a,b)));
  const len=t=>{let s=0;for(let i=0;i<t.length-1;i++)s+=D[t[i]][t[i+1]];return s};
  const opt=(t,f)=>{let imp=true;
    while(imp){imp=false;
      for(let i=f?1:0;i<N-1;i++)for(let j=i+1;j<N;j++){
        const a=i>0?D[t[i-1]][t[i]]:0,b=j<N-1?D[t[j]][t[j+1]]:0;
        const a2=i>0?D[t[i-1]][t[j]]:0,b2=j<N-1?D[t[i]][t[j+1]]:0;
        if(a2+b2<a+b-1e-9){const seg=t.slice(i,j+1).reverse();t.splice(i,j-i+1,...seg);imp=true}
      }}
    return t};
  const nn=s=>{const t=[s],left=new Set([...Array(N).keys()]);left.delete(s);
    while(left.size){const c=t[t.length-1];let b=-1,bd=1e18;for(const k of left)if(D[c][k]<bd){bd=D[c][k];b=k}t.push(b);left.delete(b)}return t};
  let best=null;
  for(const s of (fixed>=0?[fixed]:[...Array(N).keys()])){const t=opt(nn(s),fixed>=0),l=len(t);if(!best||l<best[0])best=[l,t]}
  order=best[1].filter(k=>!(off&&k===0)).map(k=>act[k-off]);
}

/* ---------- Affichage ---------- */
function popHtml(p){
  const d=(p.t||'').slice(0,10).split('-').reverse().join('/');
  const fd=p.fait&&p.fait_le?' · fait le '+p.fait_le.slice(0,10).split('-').reverse().join('/'):'';
  const has=search&&search.id===p.id;
  return `<div class="pop"><b>${esc(nameOf(p))}</b><br><small>Signalé le ${esc(d)}${esc(fd)}${p.nombre?' · '+p.nombre+' champi':''}</small>
    <button class="${p.fait?'u':''}" onclick="toggleDone(${p.id})">${p.fait?'Annuler « coin fait »':'Coin fait'}</button>
    <button class="o" onclick="setStart(${p.id})">${p.id===startId?'Retirer le départ':'Partir d\'ici'}</button>
    <div class="rad"><input id="rad" type="number" inputmode="numeric" min="1" value="${radius}"><span>m</span><button class="o" onclick="doSearch(${p.id})">Recherche</button></div>
    ${has?'<button class="u" onclick="clearSearch()">Effacer le rayon</button>':''}</div>`;
}
function drawPoints(){
  ptLayer.clearLayers();
  pts.forEach(p=>{
    const cls='mk'+(p.fait?' ok':'')+(p.id===startId?' st':'');
    const ic=L.divIcon({className:'',html:`<div class="${cls}">${MUSH}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
    L.marker([p.lat,p.lon],{icon:ic}).addTo(ptLayer).bindPopup(()=>popHtml(p));
  });
}
function drawRoute(){
  const rem=order.map(i=>[+pts[i].lat,+pts[i].lon]);
  const line=(usedMe&&me?[[me.lat,me.lon]]:[]).concat(rem);
  routeLine.setLatLngs(showRoute?line:[]);
  carLine.setLatLngs(car&&showCar&&me?[[me.lat,me.lon],[car.lat,car.lon]]:[]);
  $('carBtn').classList.toggle('on',!!car&&showCar);
  if(!pts.length){$('info').innerHTML='Aucun coin pour le moment.';return}
  const done=pts.filter(p=>p.fait).length;
  let tot=0;for(let i=0;i<line.length-1;i++)tot+=hv(line[i],line[i+1]);
  const todo=pts.length-done;
  let h=`<b>${todo} à faire</b> · ${done}/${pts.length} faits`;
  if(order.length>1||usedMe)h+=`<small>${fmtD(tot)} · ~${Math.round(tot/1000*15)} min à pied</small>`;
  else if(!todo)h+='<small>Tout est fait</small>';
  const sp=pts.find(p=>p.id===startId);
  if(sp)h+=`<small>Départ : ${esc(nameOf(sp))} · <a href="#" onclick="setStart(null);return false">revenir à ma position</a></small>`;
  else if(me&&!usedMe)h+='<small>Tu es loin des coins : trajet calculé sans ta position.</small>';
  if(car&&me)h+=`<small>Voiture : ${fmtD(hv([me.lat,me.lon],[car.lat,car.lon]))} en ligne droite</small>`;
  $('info').innerHTML=h;
}
function refresh(){drawPoints();drawRoute()}
let toastT=null;
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,5000)}
async function load(){
  try{pts=await api('points?select=*&order=t.asc&limit=5000');pts=pts.filter(p=>p.lat!=null&&p.lon!=null);
    if(pts.length&&pts.every(p=>p.fait)){
      await api('points?fait=eq.true',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({fait:false,fait_le:null})});
      pts.forEach(p=>{p.fait=false;p.fait_le=null});
      toast('Balade terminée : tous les coins sont remis à zéro.');
    }
    plan();refresh();
    if(!fitted&&pts.length){map.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[60,60]});fitted=true}
  }catch(e){if(e.message==='login')return;$('info').textContent='Erreur de lecture : vérifie la connexion, la clé et la table "points".'}
}
window.toggleDone=async id=>{
  const p=pts.find(q=>q.id===id);if(!p)return;
  try{await api('points?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({fait:!p.fait,fait_le:p.fait?null:new Date().toISOString()})});map.closePopup();load()}
  catch(e){alert('Impossible de modifier : as-tu lancé le SQL qui ajoute les colonnes « fait » et « fait_le » ?')}
};
window.setStart=id=>{startId=(id===startId)?null:id;map.closePopup();plan();refresh()};

/* ---------- GPS ---------- */
function onPos(pos){
  const first=!me;
  me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,alt:pos.coords.altitude};
  if(!meMarker)meMarker=L.marker([me.lat,me.lon],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:1000}).addTo(map);
  else meMarker.setLatLng([me.lat,me.lon]);
  if(first&&pts.length){plan();refresh()}else drawRoute();
}
if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:5000});
$('locate').onclick=()=>{if(me)map.setView([me.lat,me.lon],Math.max(map.getZoom(),17));else alert('Position GPS pas encore trouvée (autorise la localisation).')};
$('togRoute').onclick=e=>{showRoute=!showRoute;e.currentTarget.classList.toggle('on',showRoute);drawRoute()};
$('recalc').onclick=()=>{plan();refresh()};

/* ---------- Signalement ---------- */
const SP=['Bolet','Cèpe','Girolle','Morille','Trompette','Pied de mouton','Autre'];let sel=null,pending=null,picking=false,tmp=null;
$('chips').innerHTML=SP.map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join('');
$('chips').onclick=e=>{const s=e.target.dataset.s;if(!s)return;sel=s;[...$('chips').children].forEach(c=>c.classList.toggle('sel',c.dataset.s===s))};
function clearPending(){pending=null;if(tmp){map.removeLayer(tmp);tmp=null}$('useGps').classList.add('sel');$('usePick').classList.remove('sel');$('loc').textContent='Position : GPS du téléphone'}
function openSheet(){$('msg').textContent='';$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open');clearPending()}
$('fab').onclick=()=>{closeTbl();openSheet()};
$('close').onclick=closeSheet;
$('useGps').onclick=clearPending;
$('usePick').onclick=()=>{$('sheet').classList.remove('open');picking=true;$('pickbar').hidden=false};
$('pickCancel').onclick=()=>{picking=false;$('pickbar').hidden=true;clearPending();openSheet()};
map.on('click',e=>{
  if(!picking)return;
  picking=false;$('pickbar').hidden=true;
  pending={lat:e.latlng.lat,lon:e.latlng.lng};
  if(tmp)map.removeLayer(tmp);
  tmp=L.marker(e.latlng,{icon:L.divIcon({className:'',html:'<div class="mk new">'+MUSH+'</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);
  $('useGps').classList.remove('sel');$('usePick').classList.add('sel');
  $('loc').textContent='Position : point choisi sur la carte';
  openSheet();
});
async function post(lat,lon,alt){
  const nb=parseInt($('note').value,10);
  try{
    await api('points',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title:($('ttl').value.trim()||sel),type:sel,nombre:isNaN(nb)?null:nb,lat,lon,alt,t:new Date().toISOString(),fait:false})});
    $('note').value='';$('ttl').value='';closeSheet();await load();
  }catch(e){$('msg').textContent=/column/i.test(e.message)?'Colonne manquante : lance d\'abord le SQL (type, fait, fait_le, nombre).':'Envoi refusé (vérifie la politique RLS de Supabase).'}
}
$('send').onclick=()=>{
  if(!sel){$('msg').textContent='Choisis un type de champignon.';return}
  if(pending){post(pending.lat,pending.lon,null);return}
  if(!navigator.geolocation){$('msg').textContent='GPS indisponible.';return}
  $('msg').textContent='Recherche de ta position…';
  navigator.geolocation.getCurrentPosition(p=>post(p.coords.latitude,p.coords.longitude,p.coords.altitude),()=>{$('msg').textContent='Position refusée ou introuvable.'},{enableHighAccuracy:true,timeout:20000});
};

/* ---------- Recherche (rayon) ---------- */
window.doSearch=id=>{
  const p=pts.find(q=>q.id===id);if(!p)return;
  const r=parseFloat($('rad').value);
  if(!(r>0)){alert('Indique un rayon en mètres.');return}
  radius=r;store.set('rad',String(r));
  if(search)map.removeLayer(search.circle);
  const c=L.circle([p.lat,p.lon],{radius:r,color:'#1a73e8',weight:2,dashArray:'6 6',fillColor:'#1a73e8',fillOpacity:.12,interactive:false}).addTo(map);
  search={id,circle:c};map.closePopup();map.fitBounds(c.getBounds(),{padding:[40,40]});
};
window.clearSearch=()=>{if(search){map.removeLayer(search.circle);search=null}map.closePopup()};

/* ---------- Remise à zéro ---------- */
$('raz').onclick=async()=>{
  if(!pts.some(p=>p.fait)){toast('Aucun coin fait à remettre à zéro.');return}
  if(!confirm('Remettre tous les coins à zéro ?'))return;
  try{await api('points?fait=eq.true',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({fait:false,fait_le:null})});await load();toast('Coins remis à zéro.')}
  catch(e){toast('Impossible de remettre à zéro.')}
};

/* ---------- Table (moitié basse) ---------- */
let editId=null,selId=null,hl=null;
function focusPoint(p){
  const z=Math.max(map.getZoom(),17),h=$('tbl').hidden?0:$('tbl').offsetHeight;
  const c=map.project([p.lat,p.lon],z).add([0,h/2]);
  map.setView(map.unproject(c,z),z,{animate:false});
  if(hl)map.removeLayer(hl);
  hl=L.circleMarker([p.lat,p.lon],{radius:26,color:'#4fc3f7',weight:4,fill:false,interactive:false}).addTo(map);
  selId=p.id;
}
function closeTbl(){$('tbl').hidden=true;editId=null;selId=null;if(hl){map.removeLayer(hl);hl=null}}
function renderTable(){
  const sc=$('trows').scrollTop;
  $('tcount').textContent=pts.length+' coins';
  const types=[...new Set([...SP,...pts.map(p=>p.type).filter(Boolean)])];
  $('trows').innerHTML=[...pts].reverse().map(p=>{
    const sub=[p.nombre?p.nombre+' champi':'',p.fait?'fait':'à faire',(p.t||'').slice(0,10).split('-').reverse().join('/')].filter(Boolean).join(' · ');
    const form=editId===p.id?`<div class="fm">
      <input class="f-title" placeholder="Titre" value="${esc(p.title||'')}" style="margin-bottom:8px">
      <div class="l"><select class="f-type"><option value="">Type</option>${types.map(t=>`<option${t===p.type?' selected':''}>${esc(t)}</option>`).join('')}</select>
        <input class="f-nb" type="number" inputmode="numeric" min="0" value="${p.nombre??''}" placeholder="Nombre" style="width:100px"></div>
      <label><input class="f-fait" type="checkbox"${p.fait?' checked':''}> Coin fait</label>
      <div class="l"><button class="tb" data-a="save" style="flex:1">Enregistrer</button><button class="tb g" data-a="cancel" style="flex:1">Annuler</button></div></div>`:'';
    return `<div class="tr${selId===p.id?' sel':''}" data-id="${p.id}">
      <div class="tn"><b>${esc(nameOf(p))}</b><small>${esc(sub)}</small></div>
      <div class="ta"><button class="tb g" data-a="edit">Modifier</button><button class="tb g" data-a="see">Voir</button><button class="tb r" data-a="del">Supprimer</button></div>${form}</div>`;
  }).join('');
  $('trows').scrollTop=sc;
}
$('tblBtn').onclick=()=>{if(!$('tbl').hidden){closeTbl();return}map.closePopup();renderTable();$('tbl').hidden=false};
$('tclose').onclick=closeTbl;
$('trows').onclick=async e=>{
  const a=e.target.dataset.a;if(!a)return;
  const row=e.target.closest('.tr'),id=+row.dataset.id,p=pts.find(q=>q.id===id);if(!p)return;
  if(a==='cancel'){editId=null;renderTable();return}
  focusPoint(p);
  if(a==='see'){renderTable();return}
  if(a==='edit'){editId=(editId===id)?null:id;renderTable();return}
  if(a==='del'){
    if(!confirm('Supprimer « '+nameOf(p)+' » ?')){renderTable();return}
    try{await api('points?id=eq.'+id,{method:'DELETE'});if(search&&search.id===id)clearSearch();if(startId===id)startId=null;if(hl){map.removeLayer(hl);hl=null}selId=null;editId=null;await load();renderTable();toast('Supprimé.')}
    catch(err){toast('Suppression impossible.')}
    return;
  }
  if(a==='save'){
    const fait=row.querySelector('.f-fait').checked,nb=parseInt(row.querySelector('.f-nb').value,10);
    const body={title:row.querySelector('.f-title').value.trim(),type:row.querySelector('.f-type').value||null,nombre:isNaN(nb)?null:nb,fait,fait_le:fait?(p.fait&&p.fait_le?p.fait_le:new Date().toISOString()):null};
    try{await api('points?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});editId=null;await load();renderTable();toast('Enregistré.')}
    catch(err){toast(/column/i.test(err.message)?'Colonne manquante : lance le SQL (nombre).':'Enregistrement impossible.')}
  }
};

/* ---------- Voiture (retour en ligne droite) ---------- */
const CARSVG='<svg viewBox="0 0 24 24"><path fill="#fff" d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5A1.5 1.5 0 0 1 21 12.5V17a1 1 0 0 1-1 1h-1v1.2a.8.8 0 0 1-.8.8h-1.4a.8.8 0 0 1-.8-.8V18H8v1.2a.8.8 0 0 1-.8.8H5.8a.8.8 0 0 1-.8-.8V18H4a1 1 0 0 1-1-1v-4.5A1.5 1.5 0 0 1 4.5 11H5zm2.1 0h9.8l-1-3.2a.5.5 0 0 0-.5-.3H8.6a.5.5 0 0 0-.5.3L7.1 11zM6.8 15.2a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm10.4 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg>';
let car=null,showCar=true,carMarker=null;
try{car=JSON.parse(store.get('car')||'null')}catch(e){}
const carLine=L.polyline([],{color:'#111',weight:4,opacity:.9,dashArray:'8 8',interactive:false}).addTo(map);
function drawCar(){
  if(carMarker){map.removeLayer(carMarker);carMarker=null}
  if(!car)return;
  carMarker=L.marker([car.lat,car.lon],{icon:L.divIcon({className:'',html:'<div class="mk car">'+CARSVG+'</div>',iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:500}).addTo(map)
    .bindPopup(()=>'<div class="pop"><b>Voiture</b><button class="o" onclick="placeCar()">Placer ici (ma position)</button><button class="u" onclick="removeCar()">Supprimer</button></div>');
}
window.placeCar=()=>{
  if(!me){alert('Position GPS pas encore trouvée (autorise la localisation).');return}
  car={lat:me.lat,lon:me.lon};store.set('car',JSON.stringify(car));showCar=true;map.closePopup();drawCar();drawRoute();toast('Voiture placée ici.');
};
window.removeCar=()=>{car=null;store.del('car');map.closePopup();drawCar();drawRoute()};
$('carBtn').onclick=()=>{if(!car){placeCar();return}showCar=!showCar;drawRoute()};
drawCar();

if(sess)load();else showLogin();
</script>
</body>
</html>
